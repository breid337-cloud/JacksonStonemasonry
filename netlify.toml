# Netlify build configuration — the import flow reads this automatically,
# so no settings need to be entered in the Netlify UI.
[build]
  command = "npm run build"
  publish = "_site"

[build.environment]
  NODE_VERSION = "20"

# The Cowley case study was first published under a Cockleford address.
[[redirects]]
  from = "/projects/repointing-cotswold-cottage-cockleford/"
  to = "/projects/repointing-cotswold-cottage-cowley/"
  status = 301
